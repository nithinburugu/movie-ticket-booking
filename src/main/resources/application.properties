spring.application.name=algobharat
spring.security.user.name=admin
spring.security.user.password=admin
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.datasource.url=jdbc:h2:mem:algobharatdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
server.port=8080
spring.h2.console.enabled=true

# Disable Flyway for H2 (enable only for PostgreSQL if needed)
spring.flyway.enabled=false

# Prod profile (H2 file-based for Render)
spring.profiles=prod
spring.datasource.url=jdbc:h2:mem:algobharatdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
server.port=${PORT:8080}


